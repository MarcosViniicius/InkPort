<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Entre para gerenciar a biblioteca e o catálogo OPDS.">
  <title>Entrar · {{ app_name }}</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%231f6f5c'/><path d='M22 20h20v7H22z M28.5 27h7v10h-7z M22 37h20v7H22z' fill='%23fff'/></svg>">
  <link rel="stylesheet" href="{{ static_url('style.css') }}">
</head>
<body>
  <main class="auth">
    <div class="panel">
      <div class="card">
        <span class="mark" aria-hidden="true">I</span>
        <h1>{{ app_name }}</h1>
        <p class="muted">Sua biblioteca, no seu leitor. Entre para gerenciar o acervo e as conversões.</p>

        {% if error %}
        <div class="flash err my4" role="alert"><span>{{ error }}</span></div>
        {% endif %}

        <form method="post" action="/login" class="mt4">
          <input type="hidden" name="next" value="{{ next }}">
          <div class="field">
            <label for="username">Usuário</label>
            <input id="username" name="username" value="{{ username or '' }}" autocomplete="username" autofocus required>
          </div>
          <div class="field">
            <label for="password">Senha</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
          </div>
          <button class="button block lg" type="submit">Entrar</button>
        </form>
      </div>
      <p class="muted small center mt4">
        Catálogo OPDS: <code>{{ opds_url }}</code>
      </p>
    </div>
  </main>
</body>
</html>
